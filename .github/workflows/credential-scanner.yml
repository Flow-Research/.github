name: Credential Scanner

on:
  workflow_call:
    inputs:
      scan-path:
        description: 'Path to scan (defaults to repo root)'
        required: false
        default: '.'
        type: string

jobs:
  scan:
    name: Scan for Plaintext Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run credential scanner
        shell: bash
        run: |
          set -euo pipefail
          SCAN_PATH="${{ inputs.scan-path }}"
          HAS_MATCHES=0

          # Pattern 1: Credential file names
          echo "::group::Scanning for credential files..."
          CREDENTIAL_FILES=$(find "$SCAN_PATH" -type f \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/__pycache__/*' -not -path '*/dist/*' \
            -not -path '*/target/*' -not -path '*/build/*' \
            -regextype posix-extended -regex '.*(auth\.json|credentials\.json|service-account\.json|key\.pem|\.pkcs8|secret\.[a-z]+)$' 2>/dev/null || true)

          if [ -n "$CREDENTIAL_FILES" ]; then
            echo "$CREDENTIAL_FILES"
            echo "::warning::Found potential credential files (review each)"
            HAS_MATCHES=1
          else
            echo "No credential files found"
          fi
          echo "::endgroup::"

          # Pattern 2: Inline credential assignments in source files
          echo "::group::Scanning for inline credentials in source code..."
          SCAN_FILES=$(find "$SCAN_PATH" -type f \
            \( -name '*.ts' -o -name '*.js' -o -name '*.py' -o -name '*.rs' -o -name '*.go' -o -name '*.yaml' -o -name '*.yml' -o -name '*.json' -o -name '*.toml' \) \
            -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/test/*' -not -path '*/tests/*' \
            -not -path '*/__pycache__/*' -not -path '*/dist/*' -not -path '*/target/*' \
            -not -name 'package-lock.json' -not -name '*.test.*' -not -name '*.spec.*' 2>/dev/null || true)

          for file in $SCAN_FILES; do
            [ -f "$file" ] || continue
            file "$file" | grep -q 'text' || continue

            MATCHES=$(grep -nE '(api.?key|api.?secret|access.?key|secret.?key|password|passwd|credential|auth_token|bearer|client_secret|secret_access_key)' "$file" \
              | grep -iE '(=\s*["\x27]|=>\s*["\x27]|:\s*["\x27])' \
              | grep -ivE '(//|#|<!--|/\*|example|placeholder|your_|changeme|TODO|FIXME|test_token|demo|mock|fake|stub|env\(|getenv|environ\[|process\.env)' \
              | grep -ivE '(env\.\w+|getenv|environ)' || true)

            if [ -n "$MATCHES" ]; then
              echo "::warning::Potential credential in ${file}:"
              echo "$MATCHES" | while read -r line; do
                # Handle key=val, key = val, key: val, key => val patterns
                SAFE_LINE=$(echo "$line" | sed -E 's/(=\s*["'\''"]|=>\s*["'\''"]|:\s*["'\''"])[^"'\''"]{4,}["'\''"]/\1***MASKED***/g')
                echo "  ${file}:${SAFE_LINE}"
                HAS_MATCHES=1
              done
            fi
          done
          echo "::endgroup::"

          if [ "$HAS_MATCHES" -ne 0 ]; then
            echo "::warning::Credential scan found potential issues. Review flagged files."
          fi
          echo "::notice::Credential scan complete"
